pcm.!default { type hw card 0 }
ctl.!default { type hw card 0 }

# 2026-11-06 修：原 slave 写死 hw:0,0（板载 ES8326），但 ES8326 不支持 mmap，
# 导致 dsnoop 初始化失败 -> ASR 崩溃重启 + petvoice frames=0。
# USB 麦克风（card id = Device, 08bb:2902 PCM2902）已漂到 card 1，
# 改用卡名绑定避免编号漂移；采样率取硬件原生 44100，由外层 plug 重采样到 16000。
pcm.dsnoop0 {
    type dsnoop
    ipc_key 5978293
    ipc_perm 0666
    slave {
        pcm "hw:Device,0"
        rate 44100
        channels 1
        format S16_LE
    }
}
ctl.dsnoop0 { type hw card 1 }
