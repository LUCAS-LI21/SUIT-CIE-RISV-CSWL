# K1 作为网关：end0(网线) -> wlan0(热点) 做 NAT，给 3568 发地址
interface=end0
bind-dynamic
dhcp-range=192.168.88.100,192.168.88.200,255.255.255.0,12h
dhcp-option=3,192.168.88.10
dhcp-option=6,223.5.5.5,119.29.29.29
log-dhcp
dhcp-leasefile=/tmp/dnsmasq.leases
pid-file=/tmp/dnsmasq.pid
# 只做 DHCP，不做 DNS（避免和 systemd-resolved 抢 53 端口）
port=0
